<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>J.A.R.V.I.S // Advanced AI Voice Assistant</title>

<!-- Modern Google Fonts: Sora, Space Grotesk, Space Mono, Vazirmatn (Persian), Orbitron -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Template Stylesheets -->
<link rel="stylesheet" href="templates/aetheria/aetheria.css">
<link rel="stylesheet" href="templates/ironcore/ironcore.css">
<link rel="stylesheet" href="templates/zenith/zenith.css">
<link rel="stylesheet" href="templates/omni/omni.css">
<link rel="stylesheet" href="templates/astra/astra.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #05050a;
  color: #fff;
}

/* Controls Cluster & Switchers */
.hud-controls-cluster {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}
.tmpl-selector {
  position: relative;
  display: inline-block;
  z-index: 35;
}
.tmpl-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  padding: 5px 10px;
  border-radius: 20px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  backdrop-filter: blur(12px);
  transition: all 0.2s;
  white-space: nowrap;
}
.tmpl-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.2);
}
.tmpl-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: rgba(18, 14, 30, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px;
  min-width: 195px;
  max-height: 320px;
  overflow-y: auto;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(24px);
  display: none;
  flex-direction: column;
  gap: 4px;
}
.tmpl-dropdown.open { display: flex; }
.tmpl-dropdown::-webkit-scrollbar { width: 4px; }
.tmpl-dropdown::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
.tmpl-item {
  background: transparent;
  border: 0;
  padding: 7px 11px;
  text-align: left;
  color: #c084fc;
  font-family: 'Space Grotesk', -apple-system, sans-serif;
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s;
  white-space: nowrap;
}
.tmpl-item:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.tmpl-item.active {
  background: rgba(147, 51, 234, 0.35);
  color: #fff;
  font-weight: 600;
}

/* RTL Language Layout Rules */
[dir="rtl"] {
  font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[dir="rtl"] .tmpl-dropdown {
  right: auto;
  left: 0;
  text-align: right;
}
[dir="rtl"] .tmpl-item {
  text-align: right;
  flex-direction: row-reverse;
  font-family: 'Vazirmatn', sans-serif;
}
[dir="rtl"] .ae-topbar-actions,
[dir="rtl"] .ic-topbar-right {
  flex-direction: row-reverse;
}

@media (max-width: 768px) {
  .hud-controls-cluster {
    gap: 4px;
  }
  .tmpl-btn {
    padding: 4px 7px;
    font-size: 10px;
    gap: 3px;
  }
  .tmpl-btn .btn-long-label {
    display: none;
  }
}

/* PIN Gate for secure auth */
#pinGate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #020509f2;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
</style>
</head>
<body>

<!-- Mount Container for the Active Template -->
<div id="template-mount"></div>

<!-- PIN Gate Modal -->
<div id="pinGate">
  <div style="font-family:'Orbitron',sans-serif; font-size:18px; letter-spacing:6px; color:#00e5ff">ACCESS CODE</div>
  <input id="pinInput" type="password" autocomplete="off" style="background:#06101c; border:1px solid #00e5ff55; color:#cfeefb; padding:10px 14px; font-family:'Orbitron'; font-size:16px; letter-spacing:4px; text-align:center; width:240px; outline:none; border-radius:6px">
  <button id="pinBtn" style="background:#00e5ff22; border:1px solid #00e5ff; color:#00e5ff; padding:8px 24px; font-family:'Orbitron'; font-size:12px; letter-spacing:2px; cursor:pointer; border-radius:4px">AUTHENTICATE</button>
  <div id="pinMsg" style="font-size:12px; color:#5c8397; letter-spacing:2px">&nbsp;</div>
</div>

<!-- Internationalization (i18n) & STT Manager -->
<script src="i18n.js"></script>

<!-- Core Engine -->
<script src="core.js"></script>

<!-- Template Scripts -->
<script src="templates/aetheria/aetheria.js"></script>
<script src="templates/ironcore/ironcore.js"></script>
<script src="templates/zenith/zenith.js"></script>
<script src="templates/omni/omni.js"></script>
<script src="templates/astra/astra.js"></script>

<script>
(async function() {
  "use strict";

  const TEMPLATES = {
    aetheria: window.AetheriaTemplate,
    ironcore: window.IronCoreTemplate,
    zenith: window.ZenithTemplate,
    omni: window.OmniTemplate,
    astra: window.AstraTemplate
  };

  let activeTemplateId = null;

  // 1. Resolve Default Template
  async function resolveTemplate() {
    const urlParams = new URLSearchParams(location.search);
    const paramTmpl = urlParams.get("template");
    if (paramTmpl && TEMPLATES[paramTmpl]) return paramTmpl;

    const storedTmpl = localStorage.getItem("jarvis_template");
    if (storedTmpl && TEMPLATES[storedTmpl]) return storedTmpl;

    try {
      const token = urlParams.get("token") || "";
      const r = await fetch("/api/hud/config" + (token ? `?token=${encodeURIComponent(token)}` : ""));
      if (r.ok) {
        const j = await r.json();
        if (j.default_template && TEMPLATES[j.default_template]) return j.default_template;
      }
    } catch (e) {}

    return "aetheria"; // default
  }

  // 2. Mount Template
  function setTemplate(tmplId) {
    if (!TEMPLATES[tmplId]) return;
    if (activeTemplateId && TEMPLATES[activeTemplateId]) {
      TEMPLATES[activeTemplateId].unmount();
    }
    activeTemplateId = tmplId;
    localStorage.setItem("jarvis_template", tmplId);

    const mount = document.getElementById("template-mount");
    TEMPLATES[tmplId].mount(mount);

    if (window.I18n) {
      window.I18n.applyTranslations(mount);
    }

    renderHeaderControls();
  }

  // 3. Render Header Controls (Template + Language + Whisper STT)
  function renderHeaderControls() {
    const slot = document.getElementById("template-switcher-slot");
    if (!slot) return;

    const currentTmpl = TEMPLATES[activeTemplateId] || TEMPLATES.aetheria;
    const i18n = window.I18n || { lang: "en", sttLang: "fa", t: k => k, TRANSLATIONS: {}, WHISPER_LANGUAGES: [] };
    const curLang = i18n.lang || "en";
    const curStt = i18n.sttLang || "fa";

    const curLangName = (i18n.TRANSLATIONS[curLang]?.name || curLang).split(" ")[0];
    const curSttObj = (i18n.WHISPER_LANGUAGES || []).find(l => l.id === curStt);
    const curSttLabel = curSttObj ? curSttObj.id.toUpperCase() : curStt.toUpperCase();

    slot.innerHTML = `
      <div class="hud-controls-cluster">
        <!-- Template Switcher -->
        <div class="tmpl-selector">
          <button class="tmpl-btn" id="tmpl-btn" title="HUD Template">
            <span>✦</span>
            <span class="btn-long-label">${currentTmpl.name.split(" ")[0]}</span>
            <span>▾</span>
          </button>
          <div class="tmpl-dropdown" id="tmpl-dropdown">
            <button class="tmpl-item ${activeTemplateId==='aetheria'?'active':''}" data-tmpl="aetheria">
              <span>Aetheria (Female AI)</span>
              ${activeTemplateId==='aetheria'?'✓':''}
            </button>
            <button class="tmpl-item ${activeTemplateId==='ironcore'?'active':''}" data-tmpl="ironcore">
              <span>IronCore (Tactical HUD)</span>
              ${activeTemplateId==='ironcore'?'✓':''}
            </button>
            <button class="tmpl-item ${activeTemplateId==='zenith'?'active':''}" data-tmpl="zenith">
              <span>Zenith (Minimal Orb)</span>
              ${activeTemplateId==='zenith'?'✓':''}
            </button>
            <button class="tmpl-item ${activeTemplateId==='omni'?'active':''}" data-tmpl="omni">
              <span>Omni (ChatGPT Style)</span>
              ${activeTemplateId==='omni'?'✓':''}
            </button>
            <button class="tmpl-item ${activeTemplateId==='astra'?'active':''}" data-tmpl="astra">
              <span>Astra (Gemini Style)</span>
              ${activeTemplateId==='astra'?'✓':''}
            </button>
          </div>
        </div>

        <!-- UI Language Switcher -->
        <div class="tmpl-selector">
          <button class="tmpl-btn" id="lang-btn" title="${i18n.t('language') || 'Language'}">
            <span>🌐</span>
            <span>${curLang.toUpperCase()}</span>
            <span>▾</span>
          </button>
          <div class="tmpl-dropdown" id="lang-dropdown">
            ${Object.keys(i18n.TRANSLATIONS).map(code => {
              const lang = i18n.TRANSLATIONS[code];
              const isActive = curLang === code;
              return `
                <button class="tmpl-item ${isActive ? 'active' : ''}" data-lang="${code}">
                  <span>${lang.name}</span>
                  ${isActive ? '✓' : ''}
                </button>
              `;
            }).join("")}
          </div>
        </div>

        <!-- Groq Whisper STT Mode Switcher -->
        <div class="tmpl-selector">
          <button class="tmpl-btn" id="stt-btn" title="${i18n.t('stt_mode') || 'Whisper STT'}">
            <span>🎙️</span>
            <span>STT:${curSttLabel}</span>
            <span>▾</span>
          </button>
          <div class="tmpl-dropdown" id="stt-dropdown">
            ${(i18n.WHISPER_LANGUAGES || []).map(item => {
              const isActive = curStt === item.id;
              return `
                <button class="tmpl-item ${isActive ? 'active' : ''}" data-stt="${item.id}">
                  <span>${item.name}</span>
                  ${isActive ? '✓' : ''}
                </button>
              `;
            }).join("")}
          </div>
        </div>
      </div>
    `;

    // Dropdown toggle logic
    const menus = [
      { btn: document.getElementById("tmpl-btn"), menu: document.getElementById("tmpl-dropdown") },
      { btn: document.getElementById("lang-btn"), menu: document.getElementById("lang-dropdown") },
      { btn: document.getElementById("stt-btn"), menu: document.getElementById("stt-dropdown") }
    ];

    menus.forEach(({ btn, menu }) => {
      if (!btn || !menu) return;
      btn.onclick = (e) => {
        e.stopPropagation();
        menus.forEach(m => { if (m.menu && m.menu !== menu) m.menu.classList.remove("open"); });
        menu.classList.toggle("open");
      };
    });

    document.addEventListener("click", () => {
      menus.forEach(m => { if (m.menu) m.menu.classList.remove("open"); });
    });

    // Wire Template selection
    const tmplMenu = document.getElementById("tmpl-dropdown");
    if (tmplMenu) {
      tmplMenu.querySelectorAll(".tmpl-item").forEach(item => {
        item.onclick = () => {
          tmplMenu.classList.remove("open");
          setTemplate(item.dataset.tmpl);
        };
      });
    }

    // Wire Language selection
    const langMenu = document.getElementById("lang-dropdown");
    if (langMenu) {
      langMenu.querySelectorAll(".tmpl-item").forEach(item => {
        item.onclick = () => {
          langMenu.classList.remove("open");
          const code = item.dataset.lang;
          if (window.I18n) window.I18n.setLanguage(code);
          renderHeaderControls();
        };
      });
    }

    // Wire STT selection
    const sttMenu = document.getElementById("stt-dropdown");
    if (sttMenu) {
      sttMenu.querySelectorAll(".tmpl-item").forEach(item => {
        item.onclick = () => {
          sttMenu.classList.remove("open");
          const code = item.dataset.stt;
          if (window.I18n) window.I18n.setSttLanguage(code);
          renderHeaderControls();
        };
      });
    }
  }

  // 4. Initialize Core & Launch
  if (window.I18n) window.I18n.init();

  const initialId = await resolveTemplate();
  setTemplate(initialId);

  // Initialize unified Jarvis voice engine
  window.JarvisCore.init();

  // Listen to i18n and stt changes to refresh control badges
  window.JarvisCore.on("i18n_change", () => renderHeaderControls());
  window.JarvisCore.on("stt_lang_change", () => renderHeaderControls());

  // Auth check & PIN gate
  const authed = await window.JarvisCore.checkAuth();
  if (!authed) {
    document.getElementById("pinGate").style.display = "flex";
    document.getElementById("pinInput").focus();
  }
  document.getElementById("pinBtn").onclick = async () => {
    const v = document.getElementById("pinInput").value.trim();
    if (!v) return;
    document.cookie = `jarvis_token=${encodeURIComponent(v)}; path=/; max-age=31536000; secure; samesite=lax`;
    location.reload();
  };
})();
</script>
</body>
</html>
